name: Set up Node and pnpm
description: >
  Installs pnpm (version from `packageManager` in package.json) and Node (version from a file,
  `.node-version` by default), restores the pnpm cache, and runs `pnpm install --frozen-lockfile`.
  Check out the repository first.

inputs:
  node-version-file:
    description: File holding the Node version.
    default: .node-version
  install:
    description: Whether to run `pnpm install --frozen-lockfile`.
    default: "true"

runs:
  using: composite
  steps:
    - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

    - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
      with:
        node-version-file: ${{ inputs.node-version-file }}
        cache: pnpm

    - name: Install
      if: inputs.install == 'true'
      shell: bash
      run: pnpm install --frozen-lockfile
